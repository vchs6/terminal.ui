[dependencies]
ansies = { version = "1.3.113" }
unicode = { version = "0.1.0" }

[package]
  cjc-version = "1.2.0"
  name = "cjtui"
  description = "Declarative terminal UI framework for Cangjie"
  version = "1.0.0"
  target-dir = "target"
  src-dir = "src"
  output-type = "static"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  repository = "https://github.com/vchs6/terminal.ui"
  license = ["MulanPSL-2.0"]
  # CJPM bundle/publish boundary: source distribution, not the GitHub source archive.
  include = ["/src", "/examples", "/benchmarks", "/docs/product", "/LICENSE", "/NOTICE", "/CHANGELOG.md"]
  exclude = ["/openspec", "/docs/development", "/docs/decisions", "/docs/reviews", "/docs/requirements.md", "/docs/ui-construction.md", "/docs/architecture.md", "/docs/tasks.md", "/docs/acceptance.md", "/AGENTS.md", "/BATTLE_PROTOCOL.md", "/ENGINEERING_TASK_DECOMPOSITION.md", "/CONTRIBUTING.md", "/scripts", "/tests", "/node_modules", "/package.json", "/package-lock.json", "**/target", "**/cjpm.lock", "**/cangjie-repo.toml"]
