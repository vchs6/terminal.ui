schema: spec-driven
context: |
  Language: zh-CN. Keep OpenSpec headings and SHALL/MUST keywords in English.
  cjtui is a new Cangjie terminal UI project awaiting development. Product documents are self-contained and do not depend on prior implementations or historical baselines.
  Current authorization: repository planning and development infrastructure only. No framework code, prototype, example or benchmark implementation.
  Use central ansies 1.3.113 and unicode 0.1.0. SDK baseline 1.2.0 requires compatibility evidence.
  Project tasks live in docs/tasks.md; when a concrete change starts, transfer its task state authority to that change tasks.md and keep only references in docs/tasks.md.
  Project design is docs/architecture.md, proposal is docs/development/proposal.md, requirements are fully documented in docs/requirements.md, and openspec/specs/ holds corresponding scenario projections. All describe planned requirements, not implemented capabilities.
  Future concrete changes use OpenSpec workflows; do not recreate a whole-project change.
  Superpowers plans/designs use the same authority, not duplicate docs/superpowers trees.
rules:
  proposal:
    - Separate required behavior from reference implementation; state authorization boundary.
  design:
    - Compare feasible alternatives and record responsibilities, data boundaries and failure recovery; do not claim untested syntax works.
  tasks:
    - Follow ENGINEERING_TASK_DECOMPOSITION.md; L1/L2 are not execution units.
    - Each executable L3 needs a task card, acceptance refs, dependency refs, skills and checkable L4.
    - Future tasks remain planned until dependencies, DQ review and explicit implementation authorization are satisfied.
