[package]
  cjc-version = "1.2.0"
  name = "session_lifecycle"
  version = "0.0.0"
  src-dir = "src"
  output-type = "executable"
  compile-option = "--error-count-limit all"
  link-option = "--wrap=write --wrap=cjt_buffer_write --wrap=cjt_buffer_add --wrap=cjt_open --wrap=cjt_close --wrap=poll"
[dependencies]
cjtui = { path = "../.." }
[ffi.c]
session_fault = { path = "./native" }
