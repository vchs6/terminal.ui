schema_version = 1
name = "Dark"

[variables]
accent = { type = "color", value = "#66CCFF" }

[text]
foreground = "#E8EDF2"
background = "#101820"
wrap = "none"
overflow = "clip"

[decoration]
border = "none"
shadow_enabled = false

[spacing]
padding_left = 0
padding_top = 0
padding_right = 0
padding_bottom = 0

[styles.accent.text]
foreground = { ref = "accent" }
bold = true

[styles.title.text]
bold = true

[styles.muted.text]
dim = true

[styles.danger.text]
foreground = "bright-red"
bold = true

[components.modal.decoration]
border = "rounded"
shadow_enabled = true

[components.modal.spacing]
padding_left = 1
padding_right = 1

[components.button.states.focused.text]
foreground = { ref = "accent" }
underline = true

[components.button.states.selected.text]
inverse = true

[components.button.states.disabled.text]
foreground = "bright-black"
dim = true

[components.radio.states.focused.text]
foreground = { ref = "accent" }
underline = true

[components.radio.states.selected.text]
inverse = true

[components.radio.states.disabled.text]
foreground = "bright-black"
dim = true

[components.checkbox.states.focused.text]
foreground = { ref = "accent" }
underline = true

[components.checkbox.states.selected.text]
inverse = true

[components.checkbox.states.disabled.text]
foreground = "bright-black"
dim = true

[components.text_input.states.focused.text]
foreground = { ref = "accent" }
underline = true

[components.text_input.states.selected.text]
inverse = true

[components.text_input.states.disabled.text]
foreground = "bright-black"
dim = true

[components.text_area.states.focused.text]
foreground = { ref = "accent" }
underline = true

[components.text_area.states.selected.text]
inverse = true

[components.text_area.states.disabled.text]
foreground = "bright-black"
dim = true

[components.menu_item.states.focused.text]
foreground = { ref = "accent" }
underline = true

[components.menu_item.states.selected.text]
inverse = true

[components.menu_item.states.disabled.text]
foreground = "bright-black"
dim = true

[components.horizontal_menu.states.focused.text]
foreground = { ref = "accent" }
underline = true

[components.horizontal_menu.states.selected.text]
inverse = true

[components.horizontal_menu.states.disabled.text]
foreground = "bright-black"
dim = true

[components.popup_menu.states.focused.text]
foreground = { ref = "accent" }
underline = true

[components.popup_menu.states.selected.text]
inverse = true

[components.popup_menu.states.disabled.text]
foreground = "bright-black"
dim = true
